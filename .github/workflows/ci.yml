name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: contracts compile, and the TEAL matches what is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # puyapy is the only thing needed to prove the contracts are valid. It
      # pins itself against an algopy version, so a mismatch shows up here
      # rather than at deploy time with a stack trace nobody can read.
      - name: install puyapy
        run: pip install puyapy==5.9.0

      # The contracts had no unit tests at all — correctness rested entirely on
      # an on-chain attack suite, which needs a funded account and a LocalNet.
      # These run the same Algorand Python source with no chain at all.
      - name: install test harness
        run: pip install algorand-python-testing==1.1.0 py-algorand-sdk pytest

      - name: contract unit tests
        run: pytest -q

      - name: compile every contract
        run: |
          puyapy --out-dir artifacts \
            contracts/identity_registry.py \
            contracts/reputation_registry.py \
            contracts/validation_registry.py

      # THE check worth having. The committed TEAL is what the deploy script
      # actually uploads, so it has to be the output of the committed Python.
      # Without this, a contract change that never got recompiled deploys the
      # OLD approval program while the diff shows the new logic — and every
      # attack test passes against a contract nobody is running.
      - name: the committed TEAL is the output of the committed Python
        run: |
          if ! git diff --quiet -- contracts/artifacts; then
            echo "::error::The TEAL in contracts/artifacts is stale."
            echo "Recompile and commit it, or the deploy script uploads a program"
            echo "that does not match the source in this PR:"
            git diff --stat -- contracts/artifacts
            exit 1
          fi
          echo "TEAL matches the source."

      # A runtime-only failure that every other check waves through. It type
      # checks, compiles, deploys, and passes anything that does not actually
      # move money — release_partial shipped with it and only a real escrow
      # release surfaced it. See the script for why the source forms that do and
      # do not cause it look almost identical.
      - name: no inner call is opened inside an open inner transaction
        run: python3 scripts/check-itxn-nesting.py

      - name: the ABI still exposes the methods other repos call
        run: |
          python3 - <<'PY'
          import json, sys

          # ripar-skills, ripar-explorer and the deploy script all call these by
          # name. Renaming one is a breaking change across four repositories,
          # and the failure is a runtime "method not found" on chain rather
          # than anything a type checker would catch.
          expected = {
            "IdentityRegistry": {"new_agent", "update_agent", "get_agent", "agent_address",
                                 "resolve_by_domain", "resolve_by_address", "total_agents",
                                 "deregister_agent",
                                 # Live on 768633998 since 2026-08-05.
                                 # ripar-skills still checks at runtime by
                                 # reading the approval program, because a
                                 # config pointed at an older generation is
                                 # still a config that exists — see its
                                 # src/deployed.ts, whose CONTRACT_METHODS table
                                 # transcribes these signatures from the arc56
                                 # artifact this check reads.
                                 "rotate_address"},
            "ReputationRegistry": {"bootstrap", "accept_feedback", "get_score", "recent"},
            "ValidationRegistry": {"bootstrap", "opt_in_asset", "post_job", "assign_job",
                                   "submit_result", "validation_response", "fund_job",
                                   "release_escrow", "refund_escrow", "get_escrow",
                                   "set_validator", "cancel_job", "get_job", "total_jobs",
                                   # Also live on 768634000. Same reason for
                                   # listing them: ripar_place_bid /
                                   # ripar_accept_bid / ripar_list_bids are
                                   # built against these exact names, so
                                   # renaming one here breaks a shipped tool.
                                   "place_bid", "withdraw_bid", "accept_bid", "get_bid",
                                   "release_partial", "expire_job", "set_fee",
                                   # Added by the 2026-09 audit fix. record_job_verdict
                                   # syncs a decided job's verdict to reputation now that
                                   # validation_response no longer inner-calls it, and
                                   # reclaim_stranded lets a client recover a VALIDATED
                                   # escrow left stranded by an unpayable worker.
                                   "record_job_verdict", "reclaim_stranded"},
          }

          # The SIGNATURE, not just the name. An ARC-4 selector is a hash of the
          # whole signature string, so changing an argument type is exactly as
          # breaking as renaming the method and exactly as invisible: the router
          # simply stops matching. ripar-skills derives its selectors from these
          # strings, so a drift here is a tool composing calls nothing answers.
          #
          # The 2026-09 audit added a leading `pay` argument to every box-creating
          # method — the caller funds the box MBR — which changes the selector of
          # each one exactly as a rename would, so the new strings are pinned here.
          signatures = {
            "IdentityRegistry": {"rotate_address": "rotate_address(uint64,address)bool",
                                 "agent_address": "agent_address(uint64)address",
                                 # Now caller-funded: leading pay.
                                 "new_agent": "new_agent(pay,string)uint64"},
            "ReputationRegistry": {"accept_feedback": "accept_feedback(pay,axfer,uint64,uint64)uint64",
                                   # Gained a leading job_id so the verdict is
                                   # attributable, and is now called only by
                                   # ValidationRegistry.record_job_verdict.
                                   "record_validation": "record_validation(uint64,uint64,bool)bool"},
            "ValidationRegistry": {"place_bid": "place_bid(pay,uint64,uint64,uint64,byte[])bool",
                                   "accept_bid": "accept_bid(uint64,uint64)bool",
                                   "fund_job": "fund_job(pay,axfer,uint64)uint64",
                                   "release_escrow": "release_escrow(uint64)uint64",
                                   "record_job_verdict": "record_job_verdict(pay,uint64)bool",
                                   "reclaim_stranded": "reclaim_stranded(uint64)uint64"},
          }

          bad = False
          for name, want in expected.items():
              spec = json.load(open(f"contracts/artifacts/{name}.arc56.json"))
              have = {m["name"] for m in spec["methods"]}
              missing = want - have
              if missing:
                  print(f"::error::{name} no longer exposes: {', '.join(sorted(missing))}")
                  bad = True

              by_name = {m["name"]: m for m in spec["methods"]}
              for method, expect_sig in signatures.get(name, {}).items():
                  m = by_name.get(method)
                  if not m:
                      continue
                  actual = f"{method}({','.join(a['type'] for a in m['args'])}){m.get('returns', {}).get('type', 'void')}"
                  if actual != expect_sig:
                      print(f"::error::{name}.{method} signature changed: expected {expect_sig}, got {actual}")
                      print("::error::ripar-skills hashes that exact string into a selector; this breaks it silently.")
                      bad = True
          sys.exit(1 if bad else 0)
          PY
